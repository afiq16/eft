<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Make Admin</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/navbar.css">
</head>
<body style="padding:40px 20px;">
  <div style="max-width:500px; margin:0 auto;" class="card">
    <div style="margin-bottom:16px;">
      <a href="index.html" class="nav-back-btn">← Back to Home</a>
    </div>
    <h1 style="font-family:var(--font-display); font-size:1.5rem; margin-bottom:8px;" class="text-gold">👑 Grant Admin Access</h1>
    <p style="color:var(--text-secondary); font-size:0.9rem; margin-bottom:20px;">Please login first, then click the button below to become an admin.</p>
    <button id="btn-make-admin" class="btn btn-primary" style="width:100%; margin-bottom:16px;">Make Me SUPER_ADMIN</button>
    <div id="status" style="font-size:0.85rem; color:var(--text-muted);"></div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script type="module">
    import { auth, db } from "./js/firebase-init.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    let currentUser = null;
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        document.getElementById('status').innerText = `Logged in as: ${user.email}`;
      } else {
        document.getElementById('status').innerText = `Not logged in.`;
      }
    });

    document.getElementById('btn-make-admin').addEventListener('click', async () => {
      if (!currentUser) {
        alert("Please login on the main site first.");
        return;
      }
      try {
        await setDoc(doc(db, "users", currentUser.uid), {
          role: "SUPER_ADMIN",
          email: currentUser.email,
          uid: currentUser.uid,
          fullName: "Admin",
          createdAt: new Date().toISOString()
        }, { merge: true });
        document.getElementById('status').innerText = `Success! ${currentUser.email} is now a SUPER_ADMIN.`;
      } catch (err) {
        document.getElementById('status').innerText = `Error: ${err.message}`;
      }
    });
  </script>
</body>
</html>
