<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixtures & Match Center | EF X TOUR 2026</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/tournament.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="nav-container">
      <div class="logo-area">
        <span class="logo-title">EF X TOUR 2026</span>
      </div>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="standings.html" class="nav-link">Standings</a></li>
        <li><a href="fixtures.html" class="nav-link active">Fixtures</a></li>
        <li><a href="live-draw.html" class="nav-link">Live Draw</a></li>
      </ul>
      <button class="hamburger" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>
  <div class="mobile-nav-overlay"></div>

  <div style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">
    <h2 class="text-gold" style="font-size: 2rem; margin-bottom: 30px; text-transform: uppercase;">League Fixtures</h2>

    <div id="fixtures-container" class="tournament-grid">
      <div class="card" style="text-align: center; color: var(--text-secondary);">
        Fixtures will appear once the Club Lottery completes and the admin generates match schedules.
      </div>
    </div>
  </div>

  <script src="js/mobile-nav.js"></script>
  <script src="js/firebase-config.js"></script>
  <script type="module">
    import { db } from "./js/firebase-init.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    async function loadFixtures() {
      try {
        const querySnapshot = await getDocs(collection(db, "fixtures"));
        const container = document.getElementById('fixtures-container');
        
        if (!querySnapshot.empty) {
          container.innerHTML = "";
          querySnapshot.forEach(docSnap => {
            const data = docSnap.data();
            const matchCard = document.createElement('div');
            matchCard.className = "match-card";
            matchCard.innerHTML = `
              <div class="match-team">
                <span style="font-weight: 600;">${data.homePlayer}</span>
                <span class="text-blue">(${data.homeClub})</span>
              </div>
              <div class="match-score">
                ${data.homeScore !== undefined ? `${data.homeScore} - ${data.awayScore}` : 'VS'}
              </div>
              <div class="match-team away">
                <span style="font-weight: 600;">${data.awayPlayer}</span>
                <span class="text-blue">(${data.awayClub})</span>
              </div>
            `;
            container.appendChild(matchCard);
          });
        }
      } catch (err) {
        console.error("Error loading fixtures:", err);
      }
    }
    loadFixtures();
  </script>
</body>
</html>
