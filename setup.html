<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup & Initialization | EF X TOUR 2026</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .setup-container {
      max-width: 600px;
      margin: 80px auto;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="setup-container card">
    <h2 class="text-gold" style="margin-bottom: 20px; text-align: center;">SYSTEM INITIALIZATION</h2>
    <p style="color: var(--text-secondary); margin-bottom: 20px;">
      This utility initializes the default database collections, tournament settings, security roles, default season configurations, and default rules. If data already exists, it will not be overwritten.
    </p>

    <div class="form-group">
      <label for="admin-email">Create Super Admin Email</label>
      <input type="email" id="admin-email" class="form-input" value="admin@efxtour.com" required>
    </div>
    <div class="form-group">
      <label for="admin-password">Super Admin Password</label>
      <input type="password" id="admin-password" class="form-input" value="admin123" required>
    </div>

    <button id="btn-init" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Initialize & Create Admin</button>

    <div id="setup-logs" style="margin-top: 20px; font-family: monospace; background: var(--bg-primary); padding: 15px; border-radius: 8px; font-size: 0.85rem; height: 180px; overflow-y: auto; display: none;">
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script type="module">
    import { db, auth } from "./js/firebase-init.js";
    import { doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import Utils from "./js/utils.js";

    const btnInit = document.getElementById('btn-init');
    const logsDiv = document.getElementById('setup-logs');

    function logMessage(msg) {
      logsDiv.style.display = 'block';
      logsDiv.innerHTML += `<div>&gt; ${msg}</div>`;
      logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    btnInit.addEventListener('click', async () => {
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-password').value;

      if (!email || !password) {
        alert("Please enter Super Admin credentials!");
        return;
      }

      try {
        logMessage("Checking setup status...");
        const setupDoc = await getDoc(doc(db, "settings", "setup_status"));
        
        if (setupDoc.exists()) {
          logMessage("System already initialized! Super Admin account exists.");
          alert("System is already set up. Public initialization is locked.");
          return;
        }

        logMessage("Creating Super Admin Auth Account...");
        const creds = await createUserWithEmailAndPassword(auth, email, password);
        const uid = creds.user.uid;

        logMessage("Setting Super Admin User Profile Roles...");
        await setDoc(doc(db, "users", uid), {
          uid: uid,
          email: email,
          role: "SUPER_ADMIN",
          fullName: "Afiq Organizer",
          username: "organizer_afiq",
          createdAt: new Date().toISOString()
        });

        logMessage("Initializing default configuration rules...");
        await setDoc(doc(db, "settings", "tournament"), {
          tournamentName: "EF X TOUR 2026",
          currentSeason: "Season 01",
          entryFee: "50 USD",
          registrationDeadline: "2026-09-01T23:59",
          pointsWin: 3,
          pointsDraw: 1,
          pointsLoss: 0,
          matchDuration: 10 // minutes
        });

        logMessage("Creating system default status settings...");
        await setDoc(doc(db, "settings", "setup_status"), {
          initialized: true,
          initializedAt: new Date().toISOString()
        });

        logMessage("Adding default news announcement template...");
        await setDoc(doc(db, "news", "welcome-news"), {
          newsId: "welcome-news",
          title: "Welcome to EF X TOUR 2026 Season 01!",
          description: "Get ready for the premium eFootball league platform organized by Afiq. Register today and fight for the championship!",
          author: "Admin",
          category: "Tournament News",
          createdAt: new Date().toISOString(),
          featured: true
        });

        logMessage("Initialization complete! Redirecting to login...");
        Utils.showToast("Setup Completed Successfully!", "success");
        setTimeout(() => {
          window.location.href = "login.html";
        }, 2000);
      } catch (err) {
        logMessage(`Error: ${err.message}`);
        console.error(err);
      }
    });
  </script>
</body>
</html>
