<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | EF X TOUR 2026</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .auth-container {
      max-width: 450px;
      margin: 100px auto;
      padding: 30px;
    }
  </style>
</head>
<body>
  <div class="auth-container card">
    <h2 class="text-gold" style="text-align: center; margin-bottom: 30px;">EF X TOUR 2026 LOGIN</h2>
    
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
      </div>
      
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Login</button>
    </form>

    <div style="margin-top: 20px; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
      Don't have an account? <a href="register.html">Register Profile</a>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script type="module">
    import AuthService from "./js/auth.js";
    import { auth } from "./js/firebase-init.js";

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        await AuthService.loginUser(email, password);
        // Wait briefly to allow auth token propagation, then redirect
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
