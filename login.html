<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | EF X TOUR 2026</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(0,229,255,0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(212,175,55,0.05) 0%, transparent 50%);
    }
    .auth-wrap {
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }
    .auth-card {
      background: rgba(15,16,23,0.85);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px 36px;
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 8px;
    }
    .auth-logo span {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }
    .auth-title {
      text-align: center;
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: #fff;
    }
    .auth-subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }
    .input-wrapper {
      position: relative;
      margin-bottom: 18px;
    }
    .input-wrapper label {
      display: block;
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-field {
      width: 100%;
      padding: 13px 16px;
      padding-right: 46px;
      background: rgba(23,24,34,0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.95rem;
      transition: all 0.25s;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0,229,255,0.12), 0 0 12px rgba(0,229,255,0.15);
      background: rgba(23,24,34,1);
    }
    .input-toggle {
      position: absolute;
      right: 14px;
      bottom: 13px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1.1rem;
      transition: color 0.2s;
      background: none;
      border: none;
      padding: 0;
      line-height: 1;
    }
    .input-toggle:hover { color: var(--primary); }
    .auth-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      border: none;
      background: linear-gradient(135deg, var(--primary) 0%, #00b0ff 100%);
      color: #000;
      box-shadow: 0 0 20px rgba(0,229,255,0.3);
      transition: all 0.3s;
      margin-top: 6px;
      position: relative;
      overflow: hidden;
    }
    .auth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(0,229,255,0.5);
    }
    .auth-btn:active { transform: translateY(0); }
    .auth-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .auth-btn .btn-spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: btnSpin 0.7s linear infinite;
      margin: 0 auto;
    }
    @keyframes btnSpin { to { transform: rotate(360deg); } }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.07);
    }
    .auth-divider span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .auth-link {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .auth-link a {
      color: var(--primary);
      font-weight: 600;
    }
    .auth-link a:hover { color: #fff; }
    .error-msg {
      display: none;
      background: rgba(255,23,68,0.1);
      border: 1px solid rgba(255,23,68,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--error);
      font-size: 0.875rem;
      margin-bottom: 16px;
      animation: slideDown 0.2s ease;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .home-back {
      display: block;
      text-align: center;
      margin-bottom: 20px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .home-back:hover { color: var(--primary); }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <a href="index.html" class="home-back">← Back to Home</a>
    <div class="auth-card">
      <div class="auth-logo"><span>⚡ EF X TOUR 2026</span></div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Login to your player account</p>

      <div class="error-msg" id="error-msg"></div>

      <form id="login-form" novalidate>
        <div class="input-wrapper">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="input-field" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="input-wrapper">
          <label for="password">Password</label>
          <input type="password" id="password" class="input-field" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="input-toggle" id="toggle-pw" aria-label="Toggle password visibility">👁</button>
        </div>

        <button type="submit" class="auth-btn" id="login-btn">
          <span id="btn-text">LOGIN</span>
          <div class="btn-spinner" id="btn-spinner"></div>
        </button>
      </form>

      <div class="auth-divider"><span>OR</span></div>
      <div class="auth-link">
        Don't have an account? <a href="register.html">Create Profile</a>
      </div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script type="module">
    import AuthGuard from "./js/auth-guard.js";
    import { auth } from "./js/firebase-init.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { db } from "./js/firebase-init.js";

    // Redirect if already logged in
    AuthGuard.guardPublicPage();

    // Toggle password visibility
    document.getElementById('toggle-pw').addEventListener('click', () => {
      const pw = document.getElementById('password');
      const btn = document.getElementById('toggle-pw');
      pw.type = pw.type === 'password' ? 'text' : 'password';
      btn.textContent = pw.type === 'password' ? '👁' : '🙈';
    });

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.style.display = 'block';
      el.textContent = msg;
    }
    function hideError() {
      document.getElementById('error-msg').style.display = 'none';
    }
    function setLoading(loading) {
      const btn = document.getElementById('login-btn');
      const text = document.getElementById('btn-text');
      const spinner = document.getElementById('btn-spinner');
      btn.disabled = loading;
      text.style.display = loading ? 'none' : 'block';
      spinner.style.display = loading ? 'block' : 'none';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Please fill in all fields.');
        return;
      }

      setLoading(true);
      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const user = cred.user;
        // Check role for redirect
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists() && (userDoc.data().role === 'SUPER_ADMIN' || userDoc.data().role === 'TOURNAMENT_ADMIN')) {
          window.location.href = "admin.html";
        } else {
          window.location.href = "dashboard.html";
        }
      } catch (err) {
        setLoading(false);
        let msg = "Login failed. Please try again.";
        if (err.code === 'auth/user-not-found') msg = "No account found with this email.";
        if (err.code === 'auth/wrong-password') msg = "Incorrect password. Please try again.";
        if (err.code === 'auth/invalid-credential') msg = "Invalid email or password.";
        if (err.code === 'auth/too-many-requests') msg = "Account temporarily locked. Try again later.";
        if (err.code === 'auth/invalid-email') msg = "Please enter a valid email address.";
        showError(msg);
      }
    });
  </script>
</body>
</html>
