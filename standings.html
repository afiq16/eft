<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>League Standings | EF X TOUR 2026</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .rank-medal { font-size: 1.2rem; font-weight: 800; }
    .top-1 { color: #ffd700; }
    .top-2 { color: #c0c0c0; }
    .top-3 { color: #cd7f32; }
    .player-cell { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .player-cell:hover { text-decoration: underline; color: var(--primary); }
    .player-mini-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-glass); }
  </style>
</head>
<body>
  <!-- Header -->
  <header id="main-header">
    <div class="nav-container">
      <div class="logo-area">
        <button type="button" onclick="Utils.goBack()" class="nav-back-btn" aria-label="Go back">← Back</button>
        <a href="index.html" style="-webkit-text-fill-color:initial; text-decoration:none;">
          <span class="logo-title">⚡ EF X TOUR 2026</span>
        </a>
      </div>
      <ul class="nav-links" id="main-nav">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="feed.html" class="nav-link">Feed</a></li>
        <li><a href="gallery.html" class="nav-link">Gallery</a></li>
        <li><a href="streams.html" class="nav-link">Live TV</a></li>
        <li><a href="standings.html" class="nav-link active">Standings</a></li>
        <li><a href="fixtures.html" class="nav-link">Fixtures</a></li>
      </ul>
      <div class="nav-auth">
        <a href="dashboard.html" class="btn btn-outline" style="padding:8px 16px; font-size:0.85rem;">Dashboard</a>
      </div>
      <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>
  <div class="mobile-nav-overlay" id="nav-overlay"></div>

  <div style="max-width: 1200px; margin: 40px auto; padding: 0 20px 80px;">
    <div style="text-align:center; margin-bottom:32px;">
      <h1 class="text-gold" style="font-family:var(--font-display); font-size: 2.4rem; font-weight:800; margin-bottom:8px;">🏆 Official League Standings</h1>
      <p style="color:var(--text-secondary); font-size:0.95rem;">Updated automatically after every approved match result.</p>
    </div>

    <div class="table-container" style="background:var(--bg-glass); border:1px solid var(--border-glass); border-radius:16px; padding:8px;">
      <table>
        <thead>
          <tr>
            <th style="width:60px;">Pos</th>
            <th>Player Name</th>
            <th>Assigned Club</th>
            <th>P</th>
            <th>W</th>
            <th>D</th>
            <th>L</th>
            <th>GD</th>
            <th>Pts</th>
          </tr>
        </thead>
        <tbody id="standings-body">
          <tr>
            <td colspan="9" style="text-align: center; color: var(--text-muted); padding:30px;">Standings will compute automatically after match results.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="js/mobile-nav.js"></script>
  <script src="js/firebase-config.js"></script>
  <script type="module">
    import { db } from "./js/firebase-init.js";
    import Utils from "./js/utils.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    async function loadStandings() {
      try {
        const querySnapshot = await getDocs(collection(db, "leagueTables"));
        const standingsBody = document.getElementById('standings-body');
        
        if (!querySnapshot.empty) {
          standingsBody.innerHTML = "";
          let standings = [];
          
          querySnapshot.forEach(docSnap => {
            standings.push({ playerId: docSnap.id, ...docSnap.data() });
          });

          // Sort by points, then goal difference
          standings.sort((a, b) => (b.points || 0) - (a.points || 0) || (b.goalDifference || 0) - (a.goalDifference || 0));

          standings.forEach((row, index) => {
            const rank = index + 1;
            const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
            const rankClass = rank <= 3 ? `rank-medal top-${rank}` : '';
            const avatarUrl = `https://api.dicebear.com/7.x/adventurer/svg?seed=${row.playerId}&hairColor=2c1b18,4a312c`;

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="${rankClass}">${medal}</td>
              <td>
                <div class="player-cell" onclick="window.location.href='profile.html?uid=${row.playerId}'">
                  <img src="${avatarUrl}" class="player-mini-avatar">
                  <span style="font-weight: 700;">${row.playerName || 'Player'}</span>
                </div>
              </td>
              <td class="text-blue" style="font-weight:600;">${row.clubName ? Utils.getClubWithLogoHtml(row.clubName) : 'Pending'}</td>
              <td>${row.played || 0}</td>
              <td>${row.wins || 0}</td>
              <td>${row.draws || 0}</td>
              <td>${row.losses || 0}</td>
              <td style="font-weight:700;">${row.goalDifference || 0}</td>
              <td class="text-gold" style="font-weight: 800; font-size:1.1rem;">${row.points || 0}</td>
            `;
            standingsBody.appendChild(tr);
          });
        }
      } catch (err) {
        console.error("Error loading standings:", err);
      }
    }
    loadStandings();
  </script>
  <script type="module" src="js/notifications.js"></script>
  <script type="module" src="js/floating-chat.js"></script>
</body>
</html>
