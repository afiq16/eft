<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>League Standings | EF X TOUR 2026</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="nav-container">
      <div class="logo-area">
        <span class="logo-title">EF X TOUR 2026</span>
      </div>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="standings.html" class="nav-link active">Standings</a></li>
        <li><a href="fixtures.html" class="nav-link">Fixtures</a></li>
        <li><a href="live-draw.html" class="nav-link">Live Draw</a></li>
      </ul>
      <button class="hamburger" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>
  <div class="mobile-nav-overlay"></div>

  <div style="max-width: 1200px; margin: 40px auto; padding: 0 20px;">
    <h2 class="text-gold" style="font-size: 2rem; margin-bottom: 30px; text-transform: uppercase;">League Table</h2>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Pos</th>
            <th>Player Name</th>
            <th>Club</th>
            <th>P</th>
            <th>W</th>
            <th>D</th>
            <th>L</th>
            <th>GD</th>
            <th>Pts</th>
          </tr>
        </thead>
        <tbody id="standings-body">
          <tr>
            <td colspan="9" style="text-align: center; color: var(--text-muted);">Standings will compute automatically after match results.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="js/mobile-nav.js"></script>
  <script src="js/firebase-config.js"></script>
  <script type="module">
    import { db } from "./js/firebase-init.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    async function loadStandings() {
      try {
        const querySnapshot = await getDocs(collection(db, "leagueTables"));
        const standingsBody = document.getElementById('standings-body');
        
        if (!querySnapshot.empty) {
          standingsBody.innerHTML = "";
          let standings = [];
          
          querySnapshot.forEach(docSnap => {
            standings.push(docSnap.data());
          });

          // Sort by points, then goal difference
          standings.sort((a, b) => b.points - a.points || b.goalDifference - a.goalDifference);

          standings.forEach((row, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${index + 1}</td>
              <td style="font-weight: 600;">${row.playerName}</td>
              <td class="text-blue">${row.clubName}</td>
              <td>${row.played || 0}</td>
              <td>${row.wins || 0}</td>
              <td>${row.draws || 0}</td>
              <td>${row.losses || 0}</td>
              <td>${row.goalDifference || 0}</td>
              <td class="text-gold" style="font-weight: 700;">${row.points || 0}</td>
            `;
            standingsBody.appendChild(tr);
          });
        }
      } catch (err) {
        console.error("Error loading standings:", err);
      }
    }
    loadStandings();
  </script>
</body>
</html>
