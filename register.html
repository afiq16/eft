<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | EF X TOUR 2026</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(0,229,255,0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(212,175,55,0.05) 0%, transparent 50%);
    }
    .auth-wrap {
      width: 100%;
      max-width: 560px;
      padding: 0 0 40px;
    }
    .auth-card {
      background: rgba(15,16,23,0.9);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 36px 36px 40px;
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--secondary), transparent);
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 8px;
    }
    .auth-logo span {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }
    .auth-title {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 4px;
      color: #fff;
    }
    .auth-subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-bottom: 28px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }
    .input-wrapper {
      margin-bottom: 16px;
    }
    .input-wrapper label {
      display: block;
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-field {
      width: 100%;
      padding: 12px 14px;
      background: rgba(23,24,34,0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.93rem;
      transition: all 0.25s;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--secondary);
      box-shadow: 0 0 0 3px rgba(212,175,55,0.12), 0 0 12px rgba(212,175,55,0.1);
      background: rgba(23,24,34,1);
    }
    .input-field.error { border-color: var(--error) !important; box-shadow: 0 0 0 3px rgba(255,23,68,0.12) !important; }
    textarea.input-field { resize: vertical; min-height: 80px; }
    .auth-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      border: none;
      background: linear-gradient(135deg, var(--secondary) 0%, #b8860b 100%);
      color: #000;
      box-shadow: 0 0 20px rgba(212,175,55,0.3);
      transition: all 0.3s;
      margin-top: 8px;
    }
    .auth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(212,175,55,0.5);
    }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error-msg {
      display: none;
      background: rgba(255,23,68,0.1);
      border: 1px solid rgba(255,23,68,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--error);
      font-size: 0.875rem;
      margin-bottom: 16px;
      animation: slideDown 0.2s ease;
    }
    .success-msg {
      display: none;
      background: rgba(0,230,118,0.1);
      border: 1px solid rgba(0,230,118,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--success);
      font-size: 0.875rem;
      margin-bottom: 16px;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .avatar-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(23,24,34,0.6);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
    }
    .avatar-preview img {
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 2px solid var(--secondary);
      background: var(--bg-tertiary);
    }
    .avatar-preview .av-info { flex: 1; }
    .avatar-preview .av-info p {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .avatar-preview .av-info strong {
      font-family: var(--font-display);
      color: var(--secondary);
    }
    .pw-wrapper { position: relative; }
    .pw-toggle {
      position: absolute; right: 12px; bottom: 12px;
      cursor: pointer; background: none; border: none;
      color: var(--text-muted); font-size: 1rem; padding: 0;
    }
    .pw-toggle:hover { color: var(--primary); }
    .auth-link {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 20px;
    }
    .auth-link a { color: var(--primary); font-weight: 600; }
    .home-back {
      display: block;
      text-align: center;
      margin-bottom: 16px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .home-back:hover { color: var(--primary); }
    .section-label {
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin: 20px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <a href="index.html" class="home-back">← Back to Home</a>
    <div class="auth-card">
      <div class="auth-logo"><span>⚡ EF X TOUR 2026</span></div>
      <h1 class="auth-title">Create Player Profile</h1>
      <p class="auth-subtitle">Join the ultimate eFootball tournament</p>

      <div class="avatar-preview" id="avatar-preview" style="display:none;">
        <img id="preview-avatar" src="" alt="Avatar">
        <div class="av-info">
          <strong>🎮 Your Avatar</strong>
          <p>Auto-assigned cartoon avatar.<br>You can keep or change it from your dashboard.</p>
        </div>
      </div>

      <div class="error-msg" id="error-msg"></div>
      <div class="success-msg" id="success-msg"></div>

      <form id="register-form" novalidate>
        <div class="section-label">👤 Personal Info</div>
        <div class="form-row">
          <div class="input-wrapper">
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" class="input-field" placeholder="Your real name" required>
          </div>
          <div class="input-wrapper">
            <label for="username">Esports Username *</label>
            <input type="text" id="username" class="input-field" placeholder="Your game tag" required>
          </div>
        </div>

        <div class="form-row">
          <div class="input-wrapper">
            <label for="phone">Phone / WhatsApp *</label>
            <input type="tel" id="phone" class="input-field" placeholder="+60123456789" required>
          </div>
          <div class="input-wrapper">
            <label for="country">Country *</label>
            <input type="text" id="country" class="input-field" placeholder="e.g. Malaysia" required>
          </div>
        </div>

        <div class="input-wrapper">
          <label for="bio">Esports Motto / Bio</label>
          <textarea id="bio" class="input-field" placeholder="Tell us about your strategy..."></textarea>
        </div>

        <div class="section-label">🔐 Account Credentials</div>
        <div class="form-row">
          <div class="input-wrapper">
            <label for="email">Email Address *</label>
            <input type="email" id="email" class="input-field" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="input-wrapper pw-wrapper">
            <label for="password">Password *</label>
            <input type="password" id="password" class="input-field" placeholder="Min 6 characters" required autocomplete="new-password">
            <button type="button" class="pw-toggle" id="toggle-pw">👁</button>
          </div>
        </div>

        <button type="submit" class="auth-btn" id="reg-btn">CREATE PLAYER ACCOUNT</button>
      </form>

      <div class="auth-link">Already have an account? <a href="login.html">Login here</a></div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script type="module">
    import AuthGuard from "./js/auth-guard.js";
    import { auth, db } from "./js/firebase-init.js";
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Redirect if already logged in
    AuthGuard.guardPublicPage();

    // Avatar styles
    const AVATAR_STYLES = ['adventurer','avataaars','big-ears','croodles','fun-emoji','lorelei','micah','miniavs','open-peeps','pixel-art'];
    function getAvatar(seed) {
      const style = AVATAR_STYLES[Math.floor(Math.random() * AVATAR_STYLES.length)];
      return `https://api.dicebear.com/7.x/${style}/svg?seed=${encodeURIComponent(seed)}&backgroundColor=0f1017`;
    }

    // Show avatar preview as user types username
    document.getElementById('username').addEventListener('input', function() {
      const val = this.value.trim();
      if (val.length >= 2) {
        const url = getAvatar(val);
        document.getElementById('preview-avatar').src = url;
        document.getElementById('avatar-preview').style.display = 'flex';
      }
    });

    // Password toggle
    document.getElementById('toggle-pw').addEventListener('click', () => {
      const pw = document.getElementById('password');
      const btn = document.getElementById('toggle-pw');
      pw.type = pw.type === 'password' ? 'text' : 'password';
      btn.textContent = pw.type === 'password' ? '👁' : '🙈';
    });

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.style.display = 'block';
      el.textContent = '❌ ' + msg;
      document.getElementById('success-msg').style.display = 'none';
    }
    function showSuccess(msg) {
      const el = document.getElementById('success-msg');
      el.style.display = 'block';
      el.textContent = '✅ ' + msg;
      document.getElementById('error-msg').style.display = 'none';
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('error-msg').style.display = 'none';

      const fullName = document.getElementById('fullName').value.trim();
      const username = document.getElementById('username').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const country = document.getElementById('country').value.trim();
      const bio = document.getElementById('bio').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!fullName || !username || !phone || !country || !email || !password) {
        showError('Please fill in all required fields.'); return;
      }
      if (password.length < 6) {
        showError('Password must be at least 6 characters.'); return;
      }

      const btn = document.getElementById('reg-btn');
      btn.disabled = true;
      btn.textContent = 'CREATING ACCOUNT...';

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        const user = cred.user;
        const avatarUrl = getAvatar(username);

        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          email,
          role: "PLAYER",
          fullName,
          username,
          phone,
          country,
          bio,
          profilePhoto: avatarUrl,
          createdAt: new Date().toISOString()
        });

        showSuccess('Account created! Redirecting to dashboard...');
        setTimeout(() => { window.location.href = "dashboard.html"; }, 1500);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'CREATE PLAYER ACCOUNT';
        let msg = err.message;
        if (err.code === 'auth/email-already-in-use') msg = 'This email is already registered. Please login instead.';
        if (err.code === 'auth/invalid-email') msg = 'Please enter a valid email address.';
        if (err.code === 'auth/weak-password') msg = 'Password must be at least 6 characters.';
        showError(msg);
      }
    });
  </script>
</body>
</html>
