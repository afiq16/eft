<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Profile | EF X TOUR 2026</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .register-container {
      max-width: 600px;
      margin: 60px auto;
      padding: 30px;
    }
    .register-col-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
  </style>
</head>
<body>
  <div class="register-container card">
    <h2 class="text-gold" style="text-align: center; margin-bottom: 30px;">CREATE PLAYER PROFILE</h2>

    <form id="register-form">
      <div class="register-col-2">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="username">Esports Username</label>
          <input type="text" id="username" class="form-input" required>
        </div>
      </div>

      <div class="register-col-2">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone / WhatsApp</label>
          <input type="text" id="phone" class="form-input" required>
        </div>
      </div>

      <div class="register-col-2">
        <div class="form-group">
          <label for="efootballId">eFootball ID (In-game ID)</label>
          <input type="text" id="efootballId" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="efootballUid">eFootball UID (Unique Account Number)</label>
          <input type="text" id="efootballUid" class="form-input" required>
        </div>
      </div>

      <div class="register-col-2">
        <div class="form-group">
          <label for="country">Country</label>
          <input type="text" id="country" class="form-input" placeholder="e.g. Malaysia, Indonesia" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" required>
        </div>
      </div>

      <div class="form-group">
        <label for="bio">Bio (Esports Motto)</label>
        <textarea id="bio" class="form-input" rows="3" placeholder="Tell us about your strategy..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;">Create & Verify Profile</button>
    </form>

    <div style="margin-top: 20px; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <script src="js/mobile-nav.js"></script>
  <script src="js/firebase-config.js"></script>
  <script type="module">
    import AuthService from "./js/auth.js";

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const profileData = {
        fullName: document.getElementById('fullName').value,
        username: document.getElementById('username').value,
        phone: document.getElementById('phone').value,
        efootballId: document.getElementById('efootballId').value,
        efootballUid: document.getElementById('efootballUid').value,
        country: document.getElementById('country').value,
        bio: document.getElementById('bio').value,
        profilePhoto: "" // Left blank initially
      };
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        await AuthService.registerPlayer(email, password, profileData);
        setTimeout(() => {
          if (window.Utils) window.Utils.hideLoader();
          window.location.href = "login.html";
        }, 1500);
      } catch (err) {
        if (window.Utils) {
          window.Utils.hideLoader();
          window.Utils.showToast("Registration failed: " + err.message, "error");
        } else {
          console.error("Registration failed:", err.message);
        }
      }
    });
  </script>
</body>
</html>
