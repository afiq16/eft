<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Feed | EF X TOUR 2026</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .feed-layout {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px 80px;
    }
    .feed-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .feed-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .feed-subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    /* Create Post Card */
    .create-post-card {
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .cp-top {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 14px;
    }
    .cp-avatar {
      width: 46px; height: 46px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      object-fit: cover;
    }
    .cp-textarea {
      flex: 1;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.95rem;
      resize: none;
      min-height: 80px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .cp-textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    .cp-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .cp-img-input {
      flex: 1;
      min-width: 200px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-glass);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 0.85rem;
    }

    /* Feed Posts */
    .post-card {
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .post-card:hover {
      border-color: rgba(0,229,255,0.25);
    }
    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .post-author-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .post-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border-glass);
      object-fit: cover;
    }
    .post-author-name {
      font-weight: 700;
      font-size: 0.98rem;
      color: #fff;
    }
    .post-time {
      font-size: 0.76rem;
      color: var(--text-muted);
    }
    .post-content {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .post-image {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border-glass);
      margin-bottom: 14px;
    }
    .post-actions-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 14px;
    }
    .act-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s, transform 0.15s;
    }
    .act-btn:hover { color: #fff; transform: translateY(-1px); }
    .act-btn.liked { color: #ff1744; }

    /* Comments drawer */
    .comments-box {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: none;
    }
    .comment-item {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .comment-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }
    .comment-bubble {
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 8px 12px;
      flex: 1;
    }
    .comment-author { font-weight: 700; font-size: 0.82rem; color: var(--primary); margin-bottom: 2px; }
    .comment-text { font-size: 0.84rem; color: var(--text-secondary); }
    .comment-input-wrap {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .comment-input {
      flex: 1;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 8px 14px;
      color: #fff;
      font-size: 0.85rem;
    }
    .comment-input:focus { outline: none; border-color: var(--primary); }
    .comment-btn {
      background: var(--primary);
      border: none;
      border-radius: 20px;
      padding: 0 16px;
      color: #000;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <header id="main-header">
    <div class="nav-container">
      <div class="logo-area">
        <button type="button" onclick="Utils.goBack()" class="nav-back-btn" aria-label="Go back">← Back</button>
        <a href="index.html" style="-webkit-text-fill-color:initial; text-decoration:none;">
          <span class="logo-title">⚡ EF X TOUR 2026</span>
        </a>
      </div>
      <ul class="nav-links" id="main-nav">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="feed.html" class="nav-link active">Feed</a></li>
        <li><a href="gallery.html" class="nav-link">Gallery</a></li>
        <li><a href="streams.html" class="nav-link">Live TV</a></li>
        <li class="nav-auth-only" id="nav-standings"><a href="standings.html" class="nav-link">Standings</a></li>
        <li class="nav-auth-only" id="nav-fixtures"><a href="fixtures.html" class="nav-link">Fixtures</a></li>
      </ul>
      <div class="nav-auth" id="nav-auth-btns">
        <a href="login.html" class="btn btn-outline" id="btn-nav-login" style="padding:8px 18px; font-size:0.85rem;">Login</a>
        <a href="register.html" class="btn btn-primary" id="btn-nav-reg" style="padding:8px 18px; font-size:0.85rem;">Register</a>
        <a href="dashboard.html" class="btn btn-outline nav-auth-only" id="btn-nav-dash" style="padding:8px 18px; font-size:0.85rem; display:none;">Dashboard</a>
        <button class="btn btn-outline nav-auth-only" id="btn-nav-logout" style="padding:8px 18px; font-size:0.85rem; display:none;">Logout</button>
      </div>
      <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>
  <div class="mobile-nav-overlay" id="nav-overlay"></div>

  <div class="feed-layout">
    <div class="feed-header">
      <h1 class="feed-title">⚽ Player Community Feed</h1>
      <p class="feed-subtitle">Share match clips, squad flexes, tactics, and trash talk with fellow eFootball legends!</p>
    </div>

    <!-- Create Post Form -->
    <div class="create-post-card" id="create-post-card" style="display:none;">
      <div class="cp-top">
        <img src="https://api.dicebear.com/7.x/micah/svg?seed=default&backgroundColor=b6e3f4" id="cp-avatar" class="cp-avatar">
        <textarea id="cp-text" class="cp-textarea" placeholder="Share something with the community..."></textarea>
      </div>
      <div class="cp-bottom">
        <div style="flex:1; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <input type="file" id="cp-file-input" accept="image/*" class="cp-img-input">
          <span style="font-size:0.78rem; color:var(--text-muted);">or URL:</span>
          <input type="url" id="cp-img-url" class="cp-img-input" placeholder="https://..." style="max-width:180px;">
        </div>
        <button class="btn btn-primary" id="btn-submit-post" style="padding:8px 24px;">📢 Post Update</button>
      </div>
    </div>

    <div id="feed-container">
      <div style="text-align:center; padding:40px; color:var(--text-muted);">Loading community feed...</div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script type="module">
    import { auth, db } from "./js/firebase-init.js";
    import Utils from "./js/utils.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {
      collection, addDoc, getDocs, doc, getDoc, query, orderBy, limit, updateDoc, arrayUnion, arrayRemove, onSnapshot, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let currentUser = null;
    let currentUserData = null;

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      const loggedIn = !!user;
      
      document.querySelectorAll('.nav-auth-only').forEach(el => el.style.display = loggedIn ? '' : 'none');
      document.getElementById('btn-nav-login').style.display = loggedIn ? 'none' : '';
      document.getElementById('btn-nav-reg').style.display = loggedIn ? 'none' : '';
      document.getElementById('create-post-card').style.display = loggedIn ? 'block' : 'none';

      if (user) {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
          currentUserData = userDoc.data();
          const avatarUrl = currentUserData.profilePhoto || `https://api.dicebear.com/7.x/micah/svg?seed=${user.uid}&backgroundColor=b6e3f4`;
          document.getElementById('cp-avatar').src = avatarUrl;
        }
      }
    });

    document.getElementById('btn-nav-logout')?.addEventListener('click', async () => {
      await signOut(auth);
      window.location.reload();
    });

    // Create post
    document.getElementById('btn-submit-post').addEventListener('click', async () => {
      const text = document.getElementById('cp-text').value.trim();
      let imgUrl = document.getElementById('cp-img-url').value.trim();
      const fileInput = document.getElementById('cp-file-input');

      if (!text && !imgUrl && (!fileInput.files || !fileInput.files[0])) {
        Utils.showToast("Please write something or select an image!", "warning");
        return;
      }

      Utils.showLoader();
      try {
        if (fileInput.files && fileInput.files[0]) {
          imgUrl = await readFileAsDataURL(fileInput.files[0]);
        }

        const authorName = currentUserData?.fullName || currentUserData?.username || currentUser?.displayName || currentUser?.email?.split('@')[0] || 'Player';
        const authorAvatar = currentUserData?.profilePhoto || `https://api.dicebear.com/7.x/adventurer/svg?seed=${currentUser.uid}&hairColor=2c1b18,4a312c`;

        await addDoc(collection(db, "feedPosts"), {
          authorUid: currentUser.uid,
          authorName: authorName,
          authorAvatar: authorAvatar,
          content: text,
          imageUrl: imgUrl || null,
          likes: [],
          createdAt: new Date().toISOString()
        });
        document.getElementById('cp-text').value = '';
        document.getElementById('cp-img-url').value = '';
        fileInput.value = '';
        Utils.showToast("Post published!", "success");
      } catch (err) {
        Utils.showToast(err.message, "error");
      }
      Utils.hideLoader();
    });

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = err => reject(err);
        reader.readAsDataURL(file);
      });
    }

    // Realtime feed loading
    const q = query(collection(db, "feedPosts"), orderBy("createdAt", "desc"), limit(40));
    onSnapshot(q, (snap) => {
      const container = document.getElementById('feed-container');
      if (snap.empty) {
        container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">No posts yet. Be the first to post!</div>';
        return;
      }
      container.innerHTML = '';
      snap.forEach(d => {
        const p = d.data();
        const pid = d.id;
        const liked = currentUser && p.likes && p.likes.includes(currentUser.uid);
        const card = document.createElement('div');
        card.className = 'post-card';
        
        card.innerHTML = `
          <div class="post-header">
            <div class="post-author-wrap">
              <img src="${p.authorAvatar}" class="post-avatar">
              <div>
                <div class="post-author-name">${p.authorName}</div>
                <div class="post-time">${new Date(p.createdAt).toLocaleString()}</div>
              </div>
            </div>
          </div>
          ${p.content ? `<div class="post-content">${Utils.escapeHtml(p.content)}</div>` : ''}
          ${p.imageUrl ? `<img src="${p.imageUrl}" class="post-image" onerror="this.style.display='none'">` : ''}
          <div class="post-actions-bar">
            <button class="act-btn ${liked?'liked':''}" onclick="toggleLike('${pid}', ${liked})">
              ${liked ? '❤️' : '🤍'} ${p.likes ? p.likes.length : 0} Likes
            </button>
            <button class="act-btn" onclick="toggleComments('${pid}')">
              💬 Comments
            </button>
          </div>
          <div class="comments-box" id="comments-${pid}">
            <div id="clist-${pid}">Loading comments...</div>
            ${currentUser ? `
              <div class="comment-input-wrap">
                <input type="text" id="cinput-${pid}" class="comment-input" placeholder="Write a comment..." onkeydown="if(event.key==='Enter') postComment('${pid}')">
                <button class="comment-btn" onclick="postComment('${pid}')">Send</button>
              </div>
            ` : '<div style="font-size:0.8rem; color:var(--text-muted); margin-top:8px;">Log in to join the conversation.</div>'}
          </div>
        `;
        container.appendChild(card);
      });
    });

    window.toggleLike = async function(pid, currentlyLiked) {
      if (!currentUser) { Utils.showToast("Log in to like posts!", "warning"); return; }
      const ref = doc(db, "feedPosts", pid);
      try {
        if (currentlyLiked) await updateDoc(ref, { likes: arrayRemove(currentUser.uid) });
        else await updateDoc(ref, { likes: arrayUnion(currentUser.uid) });
      } catch (err) { console.error(err); }
    };

    window.toggleComments = function(pid) {
      const box = document.getElementById(`comments-${pid}`);
      if (box.style.display === 'block') {
        box.style.display = 'none';
      } else {
        box.style.display = 'block';
        loadComments(pid);
      }
    };

    function loadComments(pid) {
      const list = document.getElementById(`clist-${pid}`);
      const cq = query(collection(db, "feedPosts", pid, "comments"), orderBy("createdAt", "asc"));
      onSnapshot(cq, (snap) => {
        list.innerHTML = '';
        if (snap.empty) {
          list.innerHTML = '<div style="font-size:0.8rem; color:var(--text-muted); padding:6px 0;">No comments yet.</div>';
          return;
        }
        snap.forEach(c => {
          const cd = c.data();
          list.innerHTML += `
            <div class="comment-item">
              <img src="${cd.authorAvatar}" class="comment-avatar">
              <div class="comment-bubble">
                <div class="comment-author">${cd.authorName}</div>
                <div class="comment-text">${Utils.escapeHtml(cd.text)}</div>
              </div>
            </div>
          `;
        });
      });
    }

    window.postComment = async function(postId) {
      const input = document.getElementById(`cinput-${postId}`);
      const text = input.value.trim();
      if (!text || !currentUser) return;
      
      input.value = '';
      try {
        const authorName = currentUserData?.fullName || currentUserData?.username || currentUser?.displayName || currentUser?.email?.split('@')[0] || 'Player';
        const authorAvatar = currentUserData?.profilePhoto || `https://api.dicebear.com/7.x/adventurer/svg?seed=${currentUser.uid}&hairColor=2c1b18,4a312c`;

        await addDoc(collection(db, "feedPosts", postId, "comments"), {
          authorUid: currentUser.uid,
          authorName: authorName,
          authorAvatar: authorAvatar,
          text: text,
          createdAt: new Date().toISOString()
        });
      } catch(err) { Utils.showToast(err.message, "error"); }
    };
  </script>
  <script src="js/mobile-nav.js"></script>
  <script type="module" src="js/notifications.js"></script>
</body>
</html>
